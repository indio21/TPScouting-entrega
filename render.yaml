databases:
  - name: tpscouting-entrega-db
    plan: free

services:
  - type: web
    name: tpscouting-entrega
    runtime: python
    plan: free
    rootDir: .
    healthCheckPath: /health
    buildCommand: |
      pip install --upgrade pip
      pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.9.1+cpu
      pip install -r requirements.txt
    startCommand: python scouting_app/seed_demo_data.py && gunicorn app:app --chdir scouting_app --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: APP_SECRET_KEY
        generateValue: true
      - key: APP_DB_URL
        fromDatabase:
          name: tpscouting-entrega-db
          property: connectionString
      - key: TRAINING_DB_URL
        fromDatabase:
          name: tpscouting-entrega-db
          property: connectionString
      - key: AUTO_TRAIN_ON_STARTUP
        value: "0"
      - key: DEMO_SEED_ON_STARTUP
        value: "1"
      - key: DEMO_SEED_PLAYERS
        value: "100"
      - key: DEMO_SEED
        value: "42"
      - key: PLAYER_LIST_PER_PAGE
        value: "20"
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: CACHE_MAX_ENTRIES
        value: "256"
      - key: EVAL_POOL_MAX
        value: "100"
      - key: ENFORCE_EVAL_POOL_LIMIT
        value: "1"
      - key: SYNC_SHORTLIST_ENABLED
        value: "0"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOW_DEFAULT_ADMIN
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
