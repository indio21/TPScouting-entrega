name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-torch-cpu.txt
            requirements-lock.txt
            requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip==26.2.1 setuptools==83.0.0
          pip install -r requirements-lock.txt
          pip install -r requirements-torch-cpu.txt
          pip install -r requirements-dev.txt

      - name: Ruff critical checks
        run: ruff check scouting_app tests scripts --select E9,F63,F7,F82 --output-format github

      - name: Run tests
        env:
          APP_SECRET_KEY: test-secret
          LOG_LEVEL: INFO
        run: |
          pytest -q --cov=scouting_app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-torch-cpu.txt
            requirements-lock.txt

      - name: Install audited runtime
        run: |
          python -m pip install --upgrade pip==26.2.1 setuptools==83.0.0
          pip install -r requirements-lock.txt
          pip install -r requirements-torch-cpu.txt
          pip install pip-audit==2.10.1

      - name: Audit installed dependencies
        run: python -m pip_audit --local --progress-spinner off

      - name: Audit direct runtime manifest
        # The CPU wheel has a local version suffix (+cpu), which pip-audit can
        # omit from an installed-environment scan. Auditing requirements.txt
        # also checks the canonical PyPI torch version.
        run: python -m pip_audit -r requirements.txt --no-deps --progress-spinner off
